<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eugene Card Marketplace | Beta Edition</title>

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='42' fill='none' stroke='%233b82f6' stroke-width='5' stroke-dasharray='210 50' transform='rotate(-45 50 50)'/><polygon points='50,18 80,35 80,68 50,85 20,68 20,35' fill='%233b82f6'/><path d='M 32 42 C 38 32, 52 32, 58 40 C 62 46, 48 54, 40 60 C 35 64, 45 70, 60 62' fill='none' stroke='%23ffffff' stroke-width='4' stroke-linecap='round'/></svg>">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            gemini: {
              bg: '#0f172a',
              card: '#1e293b',
              border: '#334155',
              hover: '#334155',
              accent: '#3b82f6',
              accentHover: '#2563eb',
              muted: '#94a3b8'
            }
          },
          fontFamily: { sans: ['Inter', 'sans-serif'] }
        }
      }
    }
  </script>

  <!-- Icons, Fonts & QR Code Library -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f8fafc; }
    .card-holo-premium {
      background: linear-gradient(135deg, #1e1b4b 0%, #311042 50%, #1e293b 100%);
      border: 1px solid rgba(99, 102, 241, 0.4);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      transition: all 0.25s ease;
    }
    .card-holo-premium:hover { 
      border-color: rgba(129, 140, 248, 0.8); 
      transform: translateY(-3px); 
      box-shadow: 0 8px 25px rgba(99, 102, 241, 0.25); 
    }
    .card-holo-standard {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      border: 1px solid #334155;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      transition: all 0.25s ease;
    }
    .card-holo-standard:hover { 
      border-color: #475569; 
      transform: translateY(-3px); 
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.6); 
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 9999px; }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-blue-600 selection:text-white relative">

  <!-- Embedded Logo SVG -->
  <svg style="display: none;">
    <defs>
      <g id="eugene-logo-mark">
        <circle cx="50" cy="50" r="42" fill="none" stroke="#3b82f6" stroke-width="5" stroke-dasharray="210 50" transform="rotate(-45 50 50)"/>
        <polygon points="50,18 80,35 80,68 50,85 20,68 20,35" fill="#3b82f6"/>
        <path d="M 32 42 C 38 32, 52 32, 58 40 C 62 46, 48 54, 40 60 C 35 64, 45 70, 60 62" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
      </g>
    </defs>
  </svg>

  <!-- Header -->
  <header class="sticky top-0 z-40 bg-slate-900/90 backdrop-blur-md border-b border-slate-800 px-4 lg:px-8 py-3">
    <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-3">
      
      <div class="flex items-center gap-3 cursor-pointer shrink-0" onclick="switchTab('catalog')">
        <div class="w-9 h-9 rounded-xl overflow-hidden bg-slate-800 border border-slate-700 p-1 flex items-center justify-center">
          <svg viewBox="0 0 100 100" class="w-full h-full"><use href="#eugene-logo-mark"/></svg>
        </div>
        <div>
          <div class="flex items-center gap-2">
            <h1 class="font-bold text-sm tracking-wide text-white uppercase">EUGENE CARD</h1>
            <span class="text-[10px] font-semibold px-2 py-0.5 rounded-full bg-blue-500/10 text-blue-400 border border-blue-500/30">Beta Edition</span>
          </div>
        </div>
      </div>

      <nav class="flex items-center gap-1 bg-slate-800/80 p-1 rounded-2xl border border-slate-700 overflow-x-auto max-w-full">
        <button id="nav-catalog" onclick="switchTab('catalog')" class="px-3 py-1.5 rounded-xl text-xs font-medium text-white bg-slate-700 flex items-center gap-1.5 whitespace-nowrap transition-all">
          <i class="fa-solid fa-layer-group text-blue-400"></i> Collection
        </button>
        <button id="nav-trade" onclick="switchTab('trade')" class="px-3 py-1.5 rounded-xl text-xs font-medium text-slate-400 hover:text-white flex items-center gap-1.5 whitespace-nowrap transition-all">
          <i class="fa-solid fa-right-left text-blue-400"></i> Trade
        </button>
        <button id="nav-auction" onclick="switchTab('auction')" class="px-3 py-1.5 rounded-xl text-xs font-medium text-slate-400 hover:text-white flex items-center gap-1.5 whitespace-nowrap transition-all">
          <i class="fa-solid fa-gavel text-emerald-400"></i> Auction
        </button>
        <button id="nav-trade-req" onclick="switchTab('trade-req')" class="px-3 py-1.5 rounded-xl text-xs font-medium text-slate-400 hover:text-white flex items-center gap-1.5 whitespace-nowrap transition-all">
          <i class="fa-solid fa-handshake text-purple-400"></i> Trade Requests
        </button>
        <button id="nav-inbox" onclick="switchTab('inbox')" class="px-3 py-1.5 rounded-xl text-xs font-medium text-slate-400 hover:text-white flex items-center gap-1.5 whitespace-nowrap transition-all relative">
          <i class="fa-solid fa-comments text-indigo-400"></i> Private Inbox
          <span id="unread-inbox-badge" class="w-2 h-2 rounded-full bg-indigo-500 hidden"></span>
        </button>
        <button id="nav-holders" onclick="switchTab('holders')" class="px-3 py-1.5 rounded-xl text-xs font-medium text-slate-400 hover:text-white flex items-center gap-1.5 whitespace-nowrap transition-all">
          <i class="fa-solid fa-users text-teal-400"></i> Holders
        </button>
        <button id="nav-history" onclick="switchTab('history')" class="px-3 py-1.5 rounded-xl text-xs font-medium text-slate-400 hover:text-white flex items-center gap-1.5 whitespace-nowrap transition-all">
          <i class="fa-solid fa-clock-rotate-left text-cyan-400"></i> History
        </button>

        <div class="h-4 w-px bg-slate-700 mx-1 self-center hidden sm:block"></div>

        <button id="nav-dashboard" onclick="switchTab('dashboard')" class="px-3 py-1.5 rounded-xl text-xs font-medium text-slate-400 hover:text-white flex items-center gap-1.5 whitespace-nowrap transition-all">
          <i class="fa-solid fa-vault text-blue-400"></i> My Vault
        </button>
        <button id="nav-wishlist" onclick="switchTab('wishlist')" class="px-3 py-1.5 rounded-xl text-xs font-medium text-slate-400 hover:text-white flex items-center gap-1.5 whitespace-nowrap transition-all">
          <i class="fa-solid fa-heart text-rose-400"></i> Wishlist (<span id="wishlist-count-badge">0</span>)
        </button>

        <div id="admin-nav-separator" class="h-4 w-px bg-slate-700 mx-1 self-center hidden"></div>

        <button id="nav-analytics" onclick="switchTab('analytics')" class="admin-only-nav hidden px-3 py-1.5 rounded-xl text-xs font-medium text-amber-300 hover:text-white flex items-center gap-1.5 whitespace-nowrap bg-amber-950/30 border border-amber-500/30">
          <i class="fa-solid fa-chart-line text-amber-400"></i> Analytics
        </button>
        <button id="nav-admin" onclick="switchTab('admin')" class="admin-only-nav hidden px-3 py-1.5 rounded-xl text-xs font-medium text-rose-400 hover:text-white flex items-center gap-1.5 whitespace-nowrap bg-rose-950/30 border border-rose-500/30">
          <i class="fa-solid fa-shield-halved"></i> Admin Hub
        </button>
        <button id="nav-inventory" onclick="switchTab('inventory')" class="admin-only-nav hidden px-3 py-1.5 rounded-xl text-xs font-medium text-amber-300 hover:text-white flex items-center gap-1.5 whitespace-nowrap bg-amber-950/30 border border-amber-500/30">
          <i class="fa-solid fa-boxes-stacked"></i> Inventory
        </button>
      </nav>

      <div class="flex items-center gap-2 shrink-0">
        <button onclick="showCartModal()" class="relative p-2.5 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl border border-slate-700 flex items-center justify-center transition-all" title="View Cart">
          <i class="fa-solid fa-cart-shopping text-xs text-amber-400"></i>
          <span id="cart-badge" class="absolute -top-1 -right-1 w-4 h-4 bg-amber-500 text-slate-950 font-bold text-[9px] rounded-full flex items-center justify-center">0</span>
        </button>

        <button id="notif-toggle-btn" onclick="openNotifications()" class="relative p-2.5 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl border border-slate-700 flex items-center justify-center transition-all">
          <i class="fa-solid fa-bell text-xs text-blue-400"></i>
          <span id="notification-badge" class="absolute -top-1 -right-1 w-4 h-4 bg-blue-600 text-white font-bold text-[9px] rounded-full flex items-center justify-center">0</span>
        </button>

        <div id="auth-header-container"></div>
      </div>

    </div>
  </header>

  <!-- CATALOG VIEW -->
  <main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6 lg:p-8 space-y-8">
    <section id="view-catalog" class="space-y-6">
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 flex flex-col sm:flex-row items-center justify-between gap-4 shadow-sm">
        <div class="flex items-center gap-4">
          <div class="w-10 h-10 rounded-xl bg-slate-800 border border-slate-700 p-1 flex items-center justify-center">
            <svg viewBox="0 0 100 100" class="w-full h-full"><use href="#eugene-logo-mark"/></svg>
          </div>
          <div>
            <span class="text-[10px] font-bold uppercase px-2.5 py-0.5 rounded-full bg-blue-500/10 text-blue-400 border border-blue-500/20 tracking-wider">LIMITED EDITION</span>
            <h2 class="text-base font-bold text-white mt-0.5">Beta Edition Card Stock</h2>
            <p class="text-xs text-slate-400">Official Primary Market Availability (2% Tax Included)</p>
          </div>
        </div>
        
        <div class="bg-slate-800/80 px-5 py-2.5 rounded-xl border border-slate-700 text-center sm:text-right w-full sm:w-auto">
          <p class="text-[10px] text-slate-400 font-semibold uppercase tracking-wider">Remaining Cards</p>
          <p class="text-xl font-bold font-mono text-blue-400"><span id="remaining-cards-count">0</span> <span class="text-slate-400 text-xs font-normal">Available</span></p>
        </div>
      </div>

      <div class="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-3 bg-slate-900 p-2.5 rounded-xl border border-slate-800">
        <div class="relative flex-1">
          <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
          <input type="text" id="search-input" oninput="renderCardGrid()" placeholder="Search serial (*01 / *001) or card name..." class="w-full bg-slate-800 border border-slate-700 rounded-lg pl-9 pr-4 py-2 text-xs text-white focus:outline-none focus:border-blue-500">
        </div>
        <div class="flex items-center gap-1.5">
          <button onclick="setFilter('ALL')" id="filter-ALL" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-blue-600 text-white transition-all">All</button>
          <button onclick="setFilter('PREMIUM')" id="filter-PREMIUM" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 text-slate-400 hover:text-white transition-all">Premium</button>
          <button onclick="setFilter('STANDARD')" id="filter-STANDARD" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 text-slate-400 hover:text-white transition-all">Standard</button>
        </div>
      </div>

      <div id="card-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4"></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-init.js"></script>

  <script>
    let inventory = [];

    // FETCH INVENTORY FROM SUPABASE DATABASE SO EVERY USER SEES ALL 42 CARDS
    async function fetchDatabaseInventory() {
      if (window.supabaseClient) {
        const { data, error } = await supabaseClient
          .from('inventory')
          .select('*')
          .order('id', { ascending: true });

        if (!error && data && data.length > 0) {
          inventory = data;
          saveInventoryLocalCache();
          renderCardGrid();
          updateRemainingCardCount();
          return;
        }
      }

      // Fallback if DB fetch fails
      const stored = localStorage.getItem('eugene_inventory_data');
      if (stored) {
        try { inventory = JSON.parse(stored); } catch(e){}
      }
      renderCardGrid();
      updateRemainingCardCount();
    }

    function saveInventoryLocalCache() {
      localStorage.setItem('eugene_inventory_data', JSON.stringify(inventory));
    }

    function updateRemainingCardCount() {
      const count = inventory.filter(c => c.status === 'AVAILABLE').length;
      const countEl = document.getElementById('remaining-cards-count');
      if (countEl) countEl.innerText = count;
    }

    document.addEventListener('DOMContentLoaded', () => {
      fetchDatabaseInventory();
      // Listen to real-time changes across all connected clients
      if (window.supabaseClient) {
        supabaseClient
          .channel('public:inventory')
          .on('postgres_changes', { event: '*', schema: 'public', table: 'inventory' }, payload => {
            fetchDatabaseInventory();
          })
          .subscribe();
      }
    });
  </script>
</body>
</html>

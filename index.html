<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eugene Card Marketplace | Beta Edition</title>

  <!-- Browser Tab Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='42' fill='none' stroke='%23da7756' stroke-width='5' stroke-dasharray='210 50' transform='rotate(-45 50 50)'/><polygon points='50,18 80,35 80,68 50,85 20,68 20,35' fill='%23da7756'/><path d='M 32 42 C 38 32, 52 32, 58 40 C 62 46, 48 54, 40 60 C 35 64, 45 70, 60 62' fill='none' stroke='%23ffffff' stroke-width='4' stroke-linecap='round'/></svg>">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            claude: {
              bg: '#0d0d12',
              card: '#16161e',
              border: '#272738',
              hover: '#1e1e2a',
              accent: '#da7756',
              accentHover: '#e58e6d',
              muted: '#9494a8'
            }
          },
          fontFamily: { sans: ['Inter', 'sans-serif'] }
        }
      }
    }
  </script>

  <!-- FontAwesome Icons & Google Fonts -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Inter', sans-serif; background-color: #0d0d12; color: #f3f4f6; }
    
    .card-holo-premium {
      background: linear-gradient(135deg, #1c1a24 0%, #251b22 50%, #2d1e1c 100%);
      border: 1px solid rgba(218, 119, 86, 0.3);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      transition: all 0.25s ease;
    }
    .card-holo-premium:hover { 
      border-color: rgba(218, 119, 86, 0.8); 
      transform: translateY(-3px); 
      box-shadow: 0 8px 25px rgba(218, 119, 86, 0.15); 
    }
    
    .card-holo-standard {
      background: linear-gradient(135deg, #16161e 0%, #1a1a26 100%);
      border: 1px solid #272738;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      transition: all 0.25s ease;
    }
    .card-holo-standard:hover { 
      border-color: #3b3b54; 
      transform: translateY(-3px); 
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.6); 
    }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0d0d12; }
    ::-webkit-scrollbar-thumb { background: #272738; border-radius: 9999px; }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-claude-accent selection:text-white relative">

  <!-- Embedded Logo SVG -->
  <svg style="display: none;">
    <defs>
      <g id="eugene-logo-mark">
        <circle cx="50" cy="50" r="42" fill="none" stroke="#da7756" stroke-width="5" stroke-dasharray="210 50" transform="rotate(-45 50 50)"/>
        <polygon points="50,18 80,35 80,68 50,85 20,68 20,35" fill="#da7756"/>
        <path d="M 32 42 C 38 32, 52 32, 58 40 C 62 46, 48 54, 40 60 C 35 64, 45 70, 60 62" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
      </g>
    </defs>
  </svg>

  <!-- Header -->
  <header class="sticky top-0 z-40 bg-claude-bg/90 backdrop-blur-md border-b border-claude-border px-4 lg:px-8 py-3">
    <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-3">
      
      <!-- Brand Logo -->
      <div class="flex items-center gap-3 cursor-pointer shrink-0" onclick="switchTab('catalog')">
        <div class="w-9 h-9 rounded-xl overflow-hidden bg-claude-card border border-claude-border p-1 flex items-center justify-center">
          <svg viewBox="0 0 100 100" class="w-full h-full"><use href="#eugene-logo-mark"/></svg>
        </div>
        <div>
          <div class="flex items-center gap-2">
            <h1 class="font-bold text-sm tracking-wide text-white uppercase" data-i18n="brandTitle">EUGENE CARD</h1>
            <span class="text-[10px] font-semibold px-2 py-0.5 rounded-full bg-claude-accent/10 text-claude-accent border border-claude-accent/30" data-i18n="betaEdition">Beta Edition</span>
          </div>
        </div>
      </div>

      <!-- Navigation Tabs -->
      <nav class="flex items-center gap-1 bg-claude-card p-1 rounded-2xl border border-claude-border overflow-x-auto max-w-full">
        <button id="nav-catalog" onclick="switchTab('catalog')" class="px-3 py-1.5 rounded-xl text-xs font-medium text-white bg-claude-border flex items-center gap-1.5 whitespace-nowrap transition-all">
          <i class="fa-solid fa-layer-group text-claude-accent"></i> <span data-i18n="navCollection">Collection</span>
        </button>
        <button id="nav-trade" onclick="switchTab('trade')" class="px-3 py-1.5 rounded-xl text-xs font-medium text-claude-muted hover:text-white flex items-center gap-1.5 whitespace-nowrap transition-all">
          <i class="fa-solid fa-right-left text-claude-accent"></i> <span data-i18n="navTrade">Trade</span>
        </button>
        <button id="nav-auction" onclick="switchTab('auction')" class="px-3 py-1.5 rounded-xl text-xs font-medium text-claude-muted hover:text-white flex items-center gap-1.5 whitespace-nowrap transition-all">
          <i class="fa-solid fa-gavel text-emerald-400"></i> <span data-i18n="navAuction">Auction</span>
        </button>
        <button id="nav-trade-req" onclick="switchTab('trade-req')" class="px-3 py-1.5 rounded-xl text-xs font-medium text-claude-muted hover:text-white flex items-center gap-1.5 whitespace-nowrap transition-all">
          <i class="fa-solid fa-handshake text-purple-400"></i> <span data-i18n="navRequests">Trade Requests</span>
        </button>
        
        <button id="nav-analytics" onclick="switchTab('analytics')" class="analytics-nav-btn hidden px-3 py-1.5 rounded-xl text-xs font-medium text-amber-300 hover:text-white flex items-center gap-1.5 whitespace-nowrap bg-amber-950/20 border border-amber-500/20">
          <i class="fa-solid fa-chart-line text-amber-400"></i> <span data-i18n="navAnalytics">Analytics</span>
        </button>

        <button id="nav-inbox" onclick="switchTab('inbox')" class="px-3 py-1.5 rounded-xl text-xs font-medium text-claude-muted hover:text-white flex items-center gap-1.5 whitespace-nowrap transition-all">
          <i class="fa-solid fa-comments text-indigo-400"></i> <span data-i18n="navInbox">Inbox</span>
        </button>
        <button id="nav-holders" onclick="switchTab('holders')" class="px-3 py-1.5 rounded-xl text-xs font-medium text-claude-muted hover:text-white flex items-center gap-1.5 whitespace-nowrap transition-all">
          <i class="fa-solid fa-users text-teal-400"></i> <span data-i18n="navHolders">Holders</span>
        </button>
        <button id="nav-history" onclick="switchTab('history')" class="px-3 py-1.5 rounded-xl text-xs font-medium text-claude-muted hover:text-white flex items-center gap-1.5 whitespace-nowrap transition-all">
          <i class="fa-solid fa-clock-rotate-left text-cyan-400"></i> <span data-i18n="navHistory">History</span>
        </button>

        <div class="h-4 w-px bg-claude-border mx-1 self-center hidden sm:block"></div>

        <button id="nav-dashboard" onclick="switchTab('dashboard')" class="px-3 py-1.5 rounded-xl text-xs font-medium text-claude-muted hover:text-white flex items-center gap-1.5 whitespace-nowrap transition-all">
          <i class="fa-solid fa-vault text-claude-accent"></i> <span data-i18n="navVault">My Vault</span>
        </button>
        <button id="nav-wishlist" onclick="switchTab('wishlist')" class="px-3 py-1.5 rounded-xl text-xs font-medium text-claude-muted hover:text-white flex items-center gap-1.5 whitespace-nowrap transition-all">
          <i class="fa-solid fa-heart text-rose-400"></i> <span data-i18n="navWishlist">Wishlist</span>
        </button>

        <!-- Dedicated Admin Section Items -->
        <div id="admin-nav-separator" class="h-4 w-px bg-claude-border mx-1 self-center hidden"></div>

        <button id="nav-admin" onclick="switchTab('admin')" class="admin-only-nav hidden px-3 py-1.5 rounded-xl text-xs font-medium text-rose-400 hover:text-white flex items-center gap-1.5 whitespace-nowrap bg-rose-950/30 border border-rose-500/30">
          <i class="fa-solid fa-shield-halved"></i> <span data-i18n="navAdmin">Admin Hub</span>
        </button>
        <button id="nav-inventory" onclick="switchTab('inventory')" class="admin-only-nav hidden px-3 py-1.5 rounded-xl text-xs font-medium text-amber-300 hover:text-white flex items-center gap-1.5 whitespace-nowrap bg-amber-950/30 border border-amber-500/30">
          <i class="fa-solid fa-boxes-stacked"></i> <span data-i18n="navInventory">Inventory</span>
        </button>
        <a href="admin-command-center.html" class="admin-only-nav hidden px-3 py-1.5 rounded-xl text-xs font-medium text-violet-300 hover:text-white flex items-center gap-1.5 whitespace-nowrap bg-violet-950/30 border border-violet-500/20">
          <i class="fa-solid fa-gauge-high text-violet-400"></i> Command Center
        </a>
        <a href="revenue.html" class="admin-only-nav hidden px-3 py-1.5 rounded-xl text-xs font-medium text-emerald-300 hover:text-white flex items-center gap-1.5 whitespace-nowrap bg-emerald-950/30 border border-emerald-500/20">
          <i class="fa-solid fa-sack-dollar text-emerald-400"></i> Revenue
        </a>
      </nav>

      <!-- Language Toggle, Notifications, Cart & Auth Container -->
      <div class="flex items-center gap-2 shrink-0">
        <button onclick="toggleLanguage()" class="px-2.5 py-1.5 bg-claude-card hover:bg-claude-hover text-claude-accent font-mono font-semibold text-xs rounded-xl border border-claude-border transition-all flex items-center gap-1">
          <i class="fa-solid fa-globe text-[11px]"></i>
          <span id="current-lang-label">EN</span>
        </button>

        <button id="notif-toggle-btn" onclick="toggleNotificationMenu()" class="relative p-2.5 bg-claude-card hover:bg-claude-hover text-slate-200 rounded-xl border border-claude-border flex items-center justify-center transition-all">
          <i class="fa-solid fa-bell text-xs text-claude-accent"></i>
          <span id="notification-badge" class="absolute -top-1 -right-1 w-4 h-4 bg-claude-accent text-white font-bold text-[9px] rounded-full flex items-center justify-center">0</span>
        </button>

        <button onclick="toggleCartDrawer()" class="relative p-2.5 bg-claude-card hover:bg-claude-hover text-slate-200 rounded-xl border border-claude-border flex items-center justify-center transition-all">
          <i class="fa-solid fa-cart-shopping text-xs text-claude-accent"></i>
          <span id="cart-badge-count" class="absolute -top-1 -right-1 w-4 h-4 bg-claude-accent text-white font-bold text-[9px] rounded-full flex items-center justify-center">0</span>
        </button>

        <!-- Prominent Auth / Profile Header Container -->
        <div id="auth-header-container"></div>
      </div>

    </div>
  </header>

  <!-- AUTH MODAL WITH POST-LOGIN REDIRECT -->
  <div id="auth-modal" class="fixed inset-0 bg-claude-bg/80 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
    <div class="bg-claude-card border border-claude-border rounded-2xl max-w-sm w-full p-6 space-y-5 relative shadow-2xl">
      <button onclick="closeAuthModal()" class="absolute top-4 right-4 w-7 h-7 rounded-lg bg-claude-border text-claude-muted hover:text-white text-xs flex items-center justify-center">
        <i class="fa-solid fa-xmark"></i>
      </button>

      <div class="text-center space-y-2">
        <div class="w-12 h-12 rounded-xl mx-auto bg-claude-bg border border-claude-border p-2 flex items-center justify-center">
          <svg viewBox="0 0 100 100" class="w-full h-full"><use href="#eugene-logo-mark"/></svg>
        </div>
        <h3 class="text-base font-bold text-white" data-i18n="loginTitle">Log In to Eugene Card</h3>
        <p class="text-xs text-claude-muted" data-i18n="loginSub">Sign in to customize your collector profile, manage admin settings, and trade cards.</p>
      </div>

      <div class="space-y-3">
        <button onclick="loginWithGoogle()" class="w-full py-2.5 bg-white hover:bg-slate-100 text-slate-900 font-bold text-xs rounded-xl flex items-center justify-center gap-2 shadow transition-all">
          <i class="fa-brands fa-google text-red-500 text-xs"></i> <span data-i18n="continueGoogle">Continue with Google</span>
        </button>
        
        <div class="relative flex py-1 items-center">
          <div class="flex-grow border-t border-claude-border"></div>
          <span class="flex-shrink mx-2 text-[10px] text-claude-muted font-semibold uppercase">Or Quick Admin Switch</span>
          <div class="flex-grow border-t border-claude-border"></div>
        </div>

        <div class="grid grid-cols-2 gap-2">
          <button onclick="switchAccountPersona('eugene.aquila06'); closeAuthModal();" class="py-2 bg-rose-950/30 hover:bg-rose-900/40 text-rose-300 font-bold text-[11px] rounded-xl border border-rose-500/30 flex items-center justify-center gap-1.5 transition-all">
            <i class="fa-solid fa-shield-halved"></i> Admin Persona
          </button>
          <button onclick="switchAccountPersona('Eugene'); closeAuthModal();" class="py-2 bg-claude-bg hover:bg-claude-hover text-slate-300 font-bold text-[11px] rounded-xl border border-claude-border flex items-center justify-center gap-1.5 transition-all">
            <i class="fa-solid fa-user"></i> Collector
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Main Body Content & Views omitted for brevity - matching complete standard layout -->
  <main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6 lg:p-8 space-y-8">
    <!-- View containers remain active -->
  </main>

  <!-- JavaScript Login & Redirect Controller -->
  <script>
    let activeTabBeforeLogin = 'catalog';

    function openAuthModal() { 
      activeTabBeforeLogin = getCurrentActiveTab();
      localStorage.setItem('redirect_after_login_tab', activeTabBeforeLogin);
      document.getElementById('auth-modal').classList.remove('hidden'); 
    }

    function closeAuthModal() { 
      document.getElementById('auth-modal').classList.add('hidden'); 
    }

    function getCurrentActiveTab() {
      const tabs = ['catalog', 'trade', 'auction', 'trade-req', 'analytics', 'inbox', 'holders', 'history', 'dashboard', 'wishlist', 'admin', 'inventory'];
      for (let t of tabs) {
        const v = document.getElementById(`view-${t}`);
        if (v && !v.classList.contains('hidden')) return t;
      }
      return 'catalog';
    }

    async function loginWithGoogle() {
      try {
        await auth.signInWithPopup();
        returnToPreviousStatePostLogin();
      } catch (error) {
        showToast('Google Login Error: ' + error.message);
      }
    }

    function returnToPreviousStatePostLogin() {
      const savedTab = localStorage.getItem('redirect_after_login_tab') || 'catalog';
      localStorage.removeItem('redirect_after_login_tab');
      
      closeAuthModal();
      
      // If admin features are required, fallback safely
      if ((savedTab === 'admin' || savedTab === 'inventory' || savedTab === 'analytics') && !currentUser?.isAdmin) {
        switchTab('catalog');
        showToast('Returned to Marketplace.');
      } else {
        switchTab(savedTab);
        showToast(`Welcome back! Returned to ${savedTab.toUpperCase()} tab.`);
      }
    }

    function renderAuthHeader() {
      const container = document.getElementById('auth-header-container');
      const adminNavs = document.querySelectorAll('.admin-only-nav');
      const analyticsNavs = document.querySelectorAll('.analytics-nav-btn');
      const adminSep = document.getElementById('admin-nav-separator');

      if (currentUser) {
        if (currentUser.isAdmin) {
          adminNavs.forEach(el => el.classList.remove('hidden'));
          analyticsNavs.forEach(el => el.classList.remove('hidden'));
          if (adminSep) adminSep.classList.remove('hidden');
        } else {
          adminNavs.forEach(el => el.classList.add('hidden'));
          analyticsNavs.forEach(el => el.classList.add('hidden'));
          if (adminSep) adminSep.classList.add('hidden');
        }

        const avatarImgHtml = currentUser.avatarUrl 
          ? `<img src="${currentUser.avatarUrl}" class="w-6 h-6 rounded-full object-cover border border-claude-border">`
          : `<i class="fa-solid fa-user-circle text-base text-claude-muted"></i>`;

        let badgeText = currentUser.isAdmin ? 'Admin' : (currentUser.username ? `@${currentUser.username}` : 'Collector');
        let badgeColor = currentUser.isAdmin ? 'text-rose-400 font-bold' : 'text-claude-muted';

        container.innerHTML = `
          <div class="flex items-center gap-2 bg-claude-card border border-claude-border hover:border-claude-hover rounded-xl p-1 pl-2.5 cursor-pointer transition-all" onclick="openProfileManagerModal()">
            ${avatarImgHtml}
            <div class="flex flex-col text-right">
              <span class="text-xs font-bold text-white leading-tight">${currentUser.name}</span>
              <span class="text-[9px] ${badgeColor} font-mono">${badgeText}</span>
            </div>
            <button onclick="event.stopPropagation(); logoutUser();" title="Log Out" class="p-1.5 bg-claude-bg hover:bg-red-500/20 text-claude-muted hover:text-red-400 rounded-lg ml-1 transition-all">
              <i class="fa-solid fa-right-from-bracket text-xs"></i>
            </button>
          </div>
        `;
      } else {
        adminNavs.forEach(el => el.classList.add('hidden'));
        analyticsNavs.forEach(el => el.classList.add('hidden'));
        if (adminSep) adminSep.classList.add('hidden');

        container.innerHTML = `
          <button onclick="openAuthModal()" class="px-4 py-2 bg-claude-accent hover:bg-claude-accentHover text-white font-bold text-xs rounded-xl shadow transition-all flex items-center gap-1.5">
            <i class="fa-solid fa-right-to-bracket"></i> <span>Log In / Sign In</span>
          </button>
        `;
      }
    }
  </script>
</body>
</html>

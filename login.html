<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Eugene Card - Login</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
    font-family:Inter,Arial,sans-serif;
}

body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:
    linear-gradient(135deg,#111827,#1f2937);
    color:white;
}


.login-box{

    width:380px;
    padding:40px;

    background:
    rgba(255,255,255,.08);

    backdrop-filter:blur(15px);

    border-radius:20px;

    box-shadow:
    0 20px 50px rgba(0,0,0,.4);

}


.logo{

    text-align:center;
    font-size:32px;
    font-weight:800;
    margin-bottom:10px;

}


.subtitle{

    text-align:center;
    opacity:.7;
    margin-bottom:30px;

}


input{

    width:100%;
    padding:14px;

    margin-bottom:15px;

    border-radius:10px;

    border:none;

    background:#ffffff15;

    color:white;

    outline:none;

}


button{

    width:100%;
    padding:14px;

    border:none;

    border-radius:10px;

    cursor:pointer;

    font-weight:bold;

    margin-top:10px;

}


.login-btn{

    background:white;
    color:#111827;

}


.google-btn{

    background:#4285f4;
    color:white;

}


.divider{

    text-align:center;
    margin:20px 0;
    opacity:.5;

}


a{

color:white;

text-decoration:none;

}



#message{

margin-top:15px;

text-align:center;

font-size:14px;

}

</style>

</head>


<body>


<div class="login-box">


<div class="logo">
Eugene Card
</div>


<div class="subtitle">
Login to your collection
</div>



<input 
id="email"
type="email"
placeholder="Email"
/>


<input
id="password"
type="password"
placeholder="Password"
/>



<button 
class="login-btn"
onclick="login()">

Login

</button>



<div class="divider">
OR
</div>



<button
class="google-btn"
onclick="googleLogin()">

Continue with Google

</button>



<div id="message"></div>


</div>





<script>


// Supabase Config

const SUPABASE_URL =
"https://yswwicdycbscurnpbqjb.supabase.co";


const SUPABASE_KEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inlzd3dpY2R5Y2JzY3VybnBicWpiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUyOTUzNjAsImV4cCI6MjEwMDg3MTM2MH0.FESrSxt3ys6WJXF768q1lXJceQrff6T6WLgCn8prEw8";


const supabaseClient =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);





async function login(){


const email =
document
.getElementById("email")
.value;


const password =
document
.getElementById("password")
.value;



const {data,error} =
await supabaseClient.auth
.signInWithPassword({

email,
password

});



if(error){

show(error.message);
return;

}



window.location.href="index.html";


}





async function googleLogin(){


const {error}=

await supabaseClient.auth
.signInWithOAuth({

provider:"google",

options:{

redirectTo:
window.location.origin+
"/index.html"

}

});



if(error){

show(error.message);

}


}




function show(text){

document
.getElementById("message")
.innerHTML=text;

}





// Already logged in

(async()=>{


const {

data:{session}

}=

await supabaseClient.auth
.getSession();



if(session){

window.location.href="index.html";

}


})();


</script>


</body>
</html>

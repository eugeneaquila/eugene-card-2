<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eugene Card | Marketplace</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <header>
    <div class="logo">Eugene Card</div>
    <nav>
      <a href="marketplace.html" class="active">Marketplace</a>
      <a href="admin-command-center.html">Command Center</a>
      <a href="analytics.html">Analytics</a>
      <a href="revenue.html">Revenue</a>
    </nav>
  </header>

  <main>
    <div class="controls-bar">
      <input type="text" id="search-input" class="search-input" placeholder="Search cards by name...">
      <select id="rarity-filter" class="filter-select">
        <option value="">All Rarities</option>
        <option value="Common">Common</option>
        <option value="Rare">Rare</option>
        <option value="Legendary">Legendary</option>
      </select>
    </div>

    <div id="card-container" class="card-grid">
      <div class="skeleton"></div>
      <div class="skeleton"></div>
      <div class="skeleton"></div>
    </div>
  </main>

  <div id="toast-container"></div>

  <script src="js/supabase.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
